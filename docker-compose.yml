services:
  # db first for infrastructure
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-arcane_codex}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-arcane_codex}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # app depends only on db so the main app can start before AI is ready
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-arcane_codex}?schema=public
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON}
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      - GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai:8000}
      - AI_MODE=${AI_MODE:-cpu}
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - AI_MODEL_CPU=${AI_MODEL_CPU:-qwen3.5:35b}
      - AI_MODEL_GPU=${AI_MODEL_GPU:-qwen2.5:7b-instruct-q4_K_M}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-700}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.4}
    volumes:
      - uploads_data:/app/public/uploads
    restart: unless-stopped

  # Ollama runtime
  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-0}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-0}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_MMAP=${OLLAMA_MMAP:-1}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Pull the configured model into the shared Ollama model volume
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:35b}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$OLLAMA_MODEL\""]
    restart: "no"

  # AI service depends on db + Ollama, but app does not depend on AI
  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - AI_MODE=${AI_MODE:-cpu}
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - AI_MODEL_CPU=${AI_MODEL_CPU:-qwen3.5:35b}
      - AI_MODEL_GPU=${AI_MODEL_GPU:-qwen2.5:7b-instruct-q4_K_M}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-700}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.4}
      - AI_WORKERS=${AI_WORKERS:-1}
      - AI_CONTEXT_CHAR_LIMIT=${AI_CONTEXT_CHAR_LIMIT:-8000}
      - AI_RETRAIN_TOKEN=${AI_RETRAIN_TOKEN}
      - AI_TRAINING_DATA_PATH=/data/feedback.jsonl
      - AI_MODEL_REGISTRY_PATH=/data/models.json
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-arcane_codex}?schema=public
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:35b}
      - OLLAMA_NUM_GPU_LAYERS=${OLLAMA_NUM_GPU_LAYERS:-0}
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-32}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_REQUEST_TIMEOUT=${OLLAMA_REQUEST_TIMEOUT:-360}
    volumes:
      - ai_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  ai_data:
  uploads_data:
  ollama_models:
