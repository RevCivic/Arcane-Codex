services:
  # ── Ollama (CPU default) ────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ── Ollama (GPU profile) ─────────────────────────────────────────────────
  ollama-gpu:
    image: ollama/ollama:latest
    profiles: ["gpu"]
    environment:
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ── Pull the model once on first start ─────────────────────────────────────
  # This service exits immediately after pulling; subsequent starts are no-ops
  # because the model is already in the ollama_models volume.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b-instruct-q4_K_M}
    entrypoint: ["/bin/sh", "-c", "ollama pull $OLLAMA_MODEL"]
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-arcane_codex}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-arcane_codex}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - AI_MODE=cpu
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - AI_MODEL_CPU=${AI_MODEL_CPU:-codellama:7b-instruct-q4}
      - AI_MODEL_GPU=${AI_MODEL_GPU:-mistral:7b-instruct}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-700}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.4}
      - AI_RETRAIN_TOKEN=${AI_RETRAIN_TOKEN}
      - AI_TRAINING_DATA_PATH=/data/feedback.jsonl
      - AI_MODEL_REGISTRY_PATH=/data/models.json
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-arcane_codex}?schema=public
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b-instruct-q4_K_M}
      - OLLAMA_NUM_GPU_LAYERS=${OLLAMA_NUM_GPU_LAYERS:-0}
    volumes:
      - ai_data:/data
    restart: unless-stopped

  ai-gpu:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    profiles: ["gpu"]
    depends_on:
      ollama-gpu:
        condition: service_healthy
    environment:
      - AI_MODE=gpu
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - AI_MODEL_CPU=${AI_MODEL_CPU:-codellama:7b-instruct-q4}
      - AI_MODEL_GPU=${AI_MODEL_GPU:-mistral:7b-instruct}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-700}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.4}
      - AI_TRAINING_DATA_PATH=/data/feedback.jsonl
      - AI_MODEL_REGISTRY_PATH=/data/models.json
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-arcane_codex}?schema=public
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama-gpu:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b-instruct-q4_K_M}
      - OLLAMA_NUM_GPU_LAYERS=${OLLAMA_NUM_GPU_LAYERS:--1}
    volumes:
      - ai_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      # HOST_PORT controls which port on the host machine maps to the app.
      # Set HOST_PORT in a .env file or export it before running `docker compose up`.
      # Defaults to 3000 if not set.
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-arcane_codex}?schema=public
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON}
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      - GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai:8000}
      - AI_MODE=${AI_MODE:-cpu}
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - AI_MODEL_CPU=${AI_MODEL_CPU:-codellama:7b-instruct-q4}
      - AI_MODEL_GPU=${AI_MODEL_GPU:-mistral:7b-instruct}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-700}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.4}
    volumes:
      - uploads_data:/app/public/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  ai_data:
  uploads_data:
  ollama_models:
